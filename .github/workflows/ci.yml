name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          fail=0
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$f" || fail=1
          done
          exit $fail
